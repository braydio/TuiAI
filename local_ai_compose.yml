services:
  localai:
    image: quay.io/go-skynet/local-ai:latest
    container_name: localai
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    environment:
      - THREADS=12
      - MODELS_PATH=/models
    command: [
      "/usr/bin/local-ai",
      "--threads", "4",
      "--models-path", "/models",
      "--single-active-backend"
    ]

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    ports:
      - "8055:8000"
    volumes:
      - ./chroma_db:/chroma/chroma
    environment: 
      - IS_PERSISTENT=TRUE
